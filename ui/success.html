<!DOCTYPE html>
<html>
<head>
    <title>登录成功</title>
    <meta charset="UTF-8">
    <style>
        body, html {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .container {
            text-align: center;
        }
        h1 {
            font-size: 28px;
            font-weight: 600;
            color: #1c1c1e;
        }
        p {
            font-size: 18px;
            color: #8e8e93;
            margin-bottom: 30px;
        }
        button {
            padding: 10px 20px;
            background-color: #007aff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #005bb5;
        }

        #printer-selection {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .select-wrapper {
            position: relative;
            margin: 0 10px;
        }

        .select-wrapper::after {
            content: '▼';
            font-size: 0.8rem;
            color: #8e8e93;
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        #printers {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            padding: 10px 40px 10px 15px;
            border-radius: 8px;
            border: 1px solid #d1d1d6;
            font-size: 16px;
            background-color: #f2f2f7;
            color: #1c1c1e;
            cursor: pointer;
            width: 250px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #printers:hover {
            border-color: #007aff;
        }

        #printers:focus {
            outline: none;
            border-color: #007aff;
            box-shadow: 0 0 0 2px rgba(0, 122, 255, 0.2);
        }

        #input-mode {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .mode-label {
            display: flex;
            align-items: center;
            font-size: 16px;
            color: #1c1c1e;
        }
        #manual-checkbox {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            accent-color: #007aff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>登录成功</h1>
        <p>欢迎使用本应用！</p>
        <div id="printer-selection">
            <label for="printers">选择打印机:</label>
            <div class="select-wrapper">
                <select id="printers" name="printers"></select>
            </div>
        </div>
        <div id="input-mode" class="mode-toggle">
            <label class="mode-label"><input type="checkbox" id="manual-checkbox">手动输入</label>
        </div>
        <input type="text" id="scanner-input" placeholder="请扫码枪扫码输入" disabled style="width: 250px; padding: 10px; border-radius: 8px; border: 1px solid #d1d1d6; font-size: 16px; background-color: #f2f2f7; color: #1c1c1e; text-align: center;">
        <br>
        <br>
        <button onclick="gotoConcatenate()">批量拼接 TIFF</button>
        <button onclick="gotoCompress()">图片压缩对比</button>
        <button onclick="logout()">登出</button>
    </div>
    <script>
        function gotoConcatenate() {
            window.pywebview.api.goto_concatenate_page();
        }

        function gotoCompress() {
            window.pywebview.api.goto_compress_page();
        }

        function logout() {
            window.pywebview.api.handle_logout();
        }

        function fetchPrinters() {
            fetch('http://127.0.0.1:6789/printer/list')
                .then(response => response.json())
                .then(data => {
                    const printerSelect = document.getElementById('printers');
                    printerSelect.innerHTML = '';
                    if (data.success) {
                        data.result.forEach(printer => {
                            const option = document.createElement('option');
                            option.value = printer.name;
                            option.textContent = printer.name;
                            printerSelect.appendChild(option);
                        });
                    } else {
                        alert('获取打印机列表失败: ' + data.message);
                    }
                })
                .catch(error => {
                    console.error('获取打印机列表失败:', error);
                    alert('获取打印机列表失败');
                });
        }

        let listener = null;
        let code = '';

        function onKeyPress(event) {
            const { key } = event;
            if (key === 'Enter') {
                event.stopPropagation();
                event.preventDefault();
                if (listener) {
                    listener(code);
                }
                code = '';
                return;
            }
            code += key;
        }

        function start() {
            stop();
            window.addEventListener('keypress', onKeyPress);
        }

        function stop() {
            window.removeEventListener('keypress', onKeyPress);
        }

        function onScanResult(_listener) {
            listener = _listener;
        }

        const scanner = {
            start,
            stop,
            onScanResult,
        };

        function ensureFullOssUrl(pdfPath) {
            const base = 'https://yinnierp.oss-accelerate.aliyuncs.com';
            if (!pdfPath) throw new Error('pdfPath 为空');
            if (pdfPath.startsWith('http://') || pdfPath.startsWith('https://')) return pdfPath;
            return base + '/' + pdfPath.replace(/^\/+/, '');
        }

        function blobToBase64(blob) {
            return new Promise(function(resolve, reject) {
                const reader = new FileReader();
                reader.onloadend = function() {
                    const s = String(reader.result || '');
                    const base64 = s.indexOf(',') > -1 ? s.split(',')[1] : s;
                    resolve(base64);
                };
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        let manualMode = false;

        window.onload = function() {
            fetchPrinters();
            const input = document.getElementById('scanner-input');
            const checkbox = document.getElementById('manual-checkbox');

            async function processOrder(orderNumber) {
                if (!orderNumber) return;
                try {
                    const printerSelect = document.getElementById('printers');
                    const printer_name = printerSelect && printerSelect.value ? printerSelect.value : '';
                    if (!printer_name) { alert('请先选择打印机'); return; }
                    console.log('已选择打印机:', printer_name);
                    const res = await window.pywebview.api.get_waybill_pdf(orderNumber);
                    console.log('获取快递单响应:', res);
                    if (!res || !res.success || !res.pdfPath) { alert(res && res.message ? res.message : '未获取到pdfPath'); return; }
                    const url = ensureFullOssUrl(res.pdfPath);
                    console.log('下载URL:', url);
                    const fileResp = await fetch(url);
                    if (!fileResp.ok) { alert('下载PDF失败'); return; }
                    const blob = await fileResp.blob();
                    const base64 = await blobToBase64(blob);
                    console.log('PDF base64长度:', base64.length);
                    const r = await fetch('http://127.0.0.1:6789/printer/print/data', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ data: base64, file_type: 'pdf', printer_name: printer_name })
                    });
                    const json = await r.json();
                    console.log('打印接口响应:', json);
                    if (!json.success) { alert(json.message || '打印任务提交失败'); return; }
                    alert('打印任务已提交');
                } catch (e) {
                    console.error('处理失败', e);
                    alert('处理失败');
                }
            }

            function setMode(manual) {
                manualMode = manual;
                if (manual) {
                    scanner.stop();
                    input.disabled = false;
                    input.placeholder = '请输入订单号后回车';
                    input.focus();
                } else {
                    input.disabled = true;
                    input.placeholder = '请扫码枪扫码输入';
                    input.value = '';
                    scanner.start();
                }
            }

            scanner.onScanResult(function(result) {
                input.value = result;
                processOrder(result);
            });

            input.addEventListener('keypress', function(e) {
                if (manualMode && e.key === 'Enter') {
                    e.preventDefault();
                    processOrder(input.value.trim());
                }
            });

            checkbox.addEventListener('change', function() {
                setMode(checkbox.checked);
            });

            setMode(false);
        };
    </script>
</body>
</html>
