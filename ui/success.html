<!DOCTYPE html>
<html>
<head>
    <title>登录成功</title>
    <meta charset="UTF-8">
    <style>
        body, html {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .container {
            text-align: center;
        }
        h1 {
            font-size: 28px;
            font-weight: 600;
            color: #1c1c1e;
        }
        p {
            font-size: 18px;
            color: #8e8e93;
            margin-bottom: 30px;
        }
        button {
            padding: 10px 20px;
            background-color: #007aff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #005bb5;
        }

        #printer-selection {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .select-wrapper {
            position: relative;
            margin: 0 10px;
        }

        .select-wrapper::after {
            content: '▼';
            font-size: 0.8rem;
            color: #8e8e93;
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        #printers {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            padding: 10px 40px 10px 15px;
            border-radius: 8px;
            border: 1px solid #d1d1d6;
            font-size: 16px;
            background-color: #f2f2f7;
            color: #1c1c1e;
            cursor: pointer;
            width: 250px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #printers:hover {
            border-color: #007aff;
        }

        #printers:focus {
            outline: none;
            border-color: #007aff;
            box-shadow: 0 0 0 2px rgba(0, 122, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>登录成功</h1>
        <p>欢迎使用本应用！</p>
        <div id="printer-selection">
            <label for="printers">选择打印机:</label>
            <div class="select-wrapper">
                <select id="printers" name="printers"></select>
            </div>
        </div>
        <br>
        <input type="text" id="scanner-input" placeholder="请扫码枪扫码输入" disabled style="width: 250px; padding: 10px; border-radius: 8px; border: 1px solid #d1d1d6; font-size: 16px; background-color: #f2f2f7; color: #1c1c1e; text-align: center;">
        <br>
        <br>
        <button onclick="logout()">登出</button>
    </div>
    <script>
        function logout() {
            window.pywebview.api.handle_logout();
        }

        function fetchPrinters() {
            fetch('http://127.0.0.1:6789/printer/list')
                .then(response => response.json())
                .then(data => {
                    const printerSelect = document.getElementById('printers');
                    printerSelect.innerHTML = '';
                    if (data.success) {
                        data.result.forEach(printer => {
                            const option = document.createElement('option');
                            option.value = printer.name;
                            option.textContent = printer.name;
                            printerSelect.appendChild(option);
                        });
                    } else {
                        alert('获取打印机列表失败: ' + data.message);
                    }
                })
                .catch(error => {
                    console.error('获取打印机列表失败:', error);
                    alert('获取打印机列表失败');
                });
        }

        let listener = null;
        let code = '';

        function onKeyPress(event) {
            const { key } = event;
            if (key === 'Enter') {
                event.stopPropagation();
                event.preventDefault();
                if (listener) {
                    listener(code);
                }
                code = '';
                return;
            }
            code += key;
        }

        function start() {
            stop();
            window.addEventListener('keypress', onKeyPress);
        }

        function stop() {
            window.removeEventListener('keypress', onKeyPress);
        }

        function onScanResult(_listener) {
            listener = _listener;
        }

        const scanner = {
            start,
            stop,
            onScanResult,
        };

        window.onload = function() {
            fetchPrinters();
            scanner.start();
            scanner.onScanResult(function(result) {
                console.log('Scanned Order Number:', result);
                const input = document.getElementById('scanner-input');
                input.value = result;
            });
        };
    </script>
</body>
</html>
