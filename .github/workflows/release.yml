name: Build and Release

on:
  workflow_dispatch:

env:
  PYTHONUTF8: 1 # 强制 Python 在 Windows 上使用 UTF-8 编码，防止中文日志导致 UnicodeEncodeError

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        include:
          - os: macos-latest
            artifact_name: py-server-macos
          - os: windows-latest
            artifact_name: py-server-windows.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Get Version
        id: get_version
        shell: bash
        run: |
          # 从 core/config.py 中提取版本号
          VERSION=$(grep "APP_VERSION =" core/config.py | cut -d'"' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected Version: $VERSION"

      - name: Build with build_ui.py
        run: python build_ui.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Version
        id: get_version
        shell: bash
        run: |
          VERSION=$(grep "APP_VERSION =" core/config.py | cut -d'"' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version || steps.get_version.outputs.VERSION }}
          name: Release v${{ needs.build.outputs.version || steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: |
            artifacts/py-server-macos/py-server-macos
            artifacts/py-server-windows.exe/py-server-windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
